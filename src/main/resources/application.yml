server:
  port: 8080
spring:
  application:
    name: kafka

  # Configuration Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Configuration Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # CHOIX 1 : Si vous gardez votre code actuel (JSON String manuel)
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: exchange-rate-group
      # CORRIGÉ : key-deserializer doit être String (pas Json)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # CORRIGÉ : cohérent avec le producer String
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Configuration Elasticsearch
  elasticsearch:
    uris: http://localhost:9200

# Configuration personnalisée
exchange-rate:
  api:
    url: https://api.exchangerate-api.com/v4/latest
    default-base-currency: USD
  kafka:
    topic: exchange-rates
  scheduler:
    fixed-rate: 60000 # 1 minute
    initial-delay: 5000

# Logging
logging:
  level:
    com.learn.kafka: DEBUG
    org.springframework.kafka: INFO
    org.elasticsearch: INFO

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always